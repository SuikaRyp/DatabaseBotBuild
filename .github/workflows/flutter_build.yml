
name: Flutter Build APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL ZIP project Flutter (GitHub Release asset)"
        required: true
        type: string
      tag:
        description: "Tag unik build"
        required: true
        type: string
      build_type:
        description: "Mode build: debug atau release"
        required: false
        default: "release"
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Validasi input wajib
        env:
          ZIP_URL: ${{ inputs.zip_url }}
          BUILD_TAG: ${{ inputs.tag }}
        run: |
          if [ -z "$ZIP_URL" ]; then
            echo "::error::Input zip_url kosong."
            exit 1
          fi

          if [ -z "$BUILD_TAG" ]; then
            echo "::error::Input tag kosong."
            exit 1
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true

      - name: Download ZIP project
        env:
          ZIP_URL: ${{ inputs.zip_url }}
        run: |
          set -euo pipefail
          curl --location --fail --show-error \
            --retry 3 \
            --retry-delay 2 \
            --output project.zip \
            "$ZIP_URL"

          if [ ! -s project.zip ]; then
            echo "::error::File ZIP kosong."
            exit 1
          fi

          ls -lh project.zip

      - name: Validate ZIP archive
        run: |
          python3 - <<'PY'
          import sys
          import zipfile

          path = "project.zip"

          if not zipfile.is_zipfile(path):
              print("::error::File yang diunduh bukan arsip ZIP yang valid.")
              sys.exit(1)

          try:
              with zipfile.ZipFile(path) as archive:
                  entries = archive.infolist()
                  files = [
                      item for item in entries
                      if not item.is_dir()
                      and not item.filename.endswith("/")
                  ]

                  # Periksa CRC isi file saja.
                  # Metadata direktori tidak divalidasi karena beberapa
                  # pembuat ZIP menghasilkan ukuran/CRC direktori yang salah.
                  for item in files:
                      try:
                          with archive.open(item, "r") as stream:
                              while stream.read(1024 * 1024):
                                  pass
                      except Exception as exc:
                          print(
                              f"::error::ZIP rusak pada file "
                              f"{item.filename}: {exc}"
                          )
                          sys.exit(1)

                  print(
                      f"Validasi selesai: {len(files)} file diperiksa; "
                      f"{len(entries) - len(files)} entri direktori dilewati."
                  )

          except (zipfile.BadZipFile, OSError) as exc:
              print(f"::error::Arsip ZIP tidak bisa dibaca: {exc}")
              sys.exit(1)
          PY

      - name: Extract ZIP
        run: |
          set -euo pipefail
          rm -rf project
          mkdir -p project

          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          from shutil import copyfileobj

          archive_path = Path("project.zip")
          destination = Path("project").resolve()

          with zipfile.ZipFile(archive_path) as archive:
              for info in archive.infolist():
                  name = info.filename.replace("\\", "/")

                  # Abaikan entri direktori; buat direktori dari path file.
                  if info.is_dir() or name.endswith("/"):
                      continue

                  target = (destination / name).resolve()

                  # Cegah ZIP Slip / path traversal.
                  if target != destination and destination not in target.parents:
                      raise SystemExit(
                          f"::error::Path tidak aman di ZIP: {name}"
                      )

                  target.parent.mkdir(parents=True, exist_ok=True)

                  try:
                      with archive.open(info, "r") as source:
                          with open(target, "wb") as output:
                              copyfileobj(source, output)
                  except Exception as exc:
                      raise SystemExit(
                          f"::error::Gagal mengekstrak {name}: {exc}"
                      )

          print("Ekstraksi ZIP selesai.")
          PY

          # Tangani ZIP yang membungkus project di satu folder.
          shopt -s nullglob dotglob
          entries=(project/*/)

          if [ "${#entries[@]}" -eq 1 ] && \
             [ -f "${entries[0]}pubspec.yaml" ]; then
            tmp="$(mktemp -d)"
            mv "${entries[0]}"* "$tmp"/
            rm -rf project
            mv "$tmp" project
          fi

      - name: Validasi pubspec.yaml
        run: |
          if [ ! -f project/pubspec.yaml ]; then
            echo "::error::pubspec.yaml tidak ditemukan di root project."
            echo "Pastikan ZIP berisi project Flutter yang benar."
            echo "Isi folder project:"
            ls -la project
            exit 1
          fi

      - name: Flutter pub get
        working-directory: project
        run: flutter pub get

      - name: Build APK
        working-directory: project
        env:
          BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          set -euo pipefail

          case "$BUILD_TYPE" in
            debug)
              flutter build apk --debug
              ;;
            release)
              flutter build apk --release
              ;;
            *)
              echo "::error::build_type harus debug atau release."
              exit 1
              ;;
          esac

      - name: Upload APK sebagai artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.tag }}
          path: project/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn
          retention-days: 1
